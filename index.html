<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1015" />
    <meta
      name="description"
      content="Ratorder es un grabador de pantalla local para Chrome y navegadores Chromium. Graba durante horas sin enviar nada a un servidor."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Ratorder — Grabador de pantalla local</title>
    <script>
      try {
        const theme = localStorage.getItem('ratorder.theme')
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main style="max-width: 540px; margin: 80px auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #f5f6f8; background: #0e1015">
        <h1>Ratorder necesita JavaScript</h1>
        <p style="color: #969ba8">
          Este grabador funciona por completo en tu navegador. Activa JavaScript
          para poder capturar la pantalla y guardar las grabaciones localmente.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
